<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TopWaatch</title>
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: transparent;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .shell {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
        background:
          radial-gradient(circle at top, rgba(124, 58, 237, 0.22), transparent 55%),
          #09090f;
        color: #f4f4f5;
      }

      .card {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 1.25rem;
        padding: 2rem 2.5rem;
        text-align: center;
      }

      .logo-wrap {
        width: 11rem;
        height: 3.5rem;
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-wrap img {
        max-width: 100%;
        max-height: 100%;
        object-fit: contain;
        user-select: none;
        -webkit-user-drag: none;
      }

      .spinner {
        width: 2rem;
        height: 2rem;
        border-radius: 9999px;
        border: 2px solid rgba(255, 255, 255, 0.12);
        border-top-color: #c084fc;
        animation: spin 0.8s linear infinite;
      }

      .status {
        min-height: 1.25rem;
        font-size: 0.95rem;
        font-weight: 500;
        color: rgba(244, 244, 245, 0.82);
        letter-spacing: 0.01em;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="shell">
      <div class="card">
        <div class="logo-wrap">
          <img src="/topwaatch-logo.png" alt="TopWaatch" draggable="false" />
        </div>
        <div class="spinner" aria-hidden="true"></div>
        <p class="status" id="status">Checking for updates…</p>
      </div>
    </div>

    <script>
      window.setStatus = (message) => {
        const node = document.getElementById("status");
        if (node && typeof message === "string") {
          node.textContent = message;
        }
      };
    </script>
  </body>
</html>
