<!doctype html>
<html lang="en" dir="ltr">
  <!--https://www.youtube.com/watch?v=dQw4w9WgXcQ -->

  <head>
    <meta charset="utf-8" />
    <link rel="icon" href="/favicon.ico?v=2" />
    <meta itemprop="image" content="/android-chrome-192x192.png?v=2" />
    <!-- <meta property="og:image" content="/android-chrome-192x192.png?v=2"> -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="description"
      content="TopWaatch. Watch movies and shows with bookmarks, progress, and history that follow you across every device."
    />
    <link
      rel="apple-touch-icon"
      sizes="180x180"
      href="/apple-touch-icon.png?v=2"
    />
  <!-- <link
    rel="icon"
    type="image/png"
    sizes="32x32"
    href="/favicon-32x32.png?v=2"
  />
  <link
    rel="icon"
    type="image/png"
    sizes="16x16"
    href="/favicon-16x16.png?v=2"
  /> -->
    <link rel="mask-icon" href="/safari-pinned-tab.svg" color="#120f1d" />
    <meta name="msapplication-TileColor" content="#120f1d" />
    <meta name="theme-color" content="#000000" />

    <!-- TopWaatch Preview Embed -->
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:image" content="/embed-preview.png" />
    <meta property="og:image" content="/embed-preview.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&family=Open+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <script src="/config.js"></script>

    {{#if env.VITE_TRACK_SCRIPT }} {{{ env.VITE_TRACK_SCRIPT }}} {{/if}}

    <!-- prevent darkreader extension from messing with our already dark site -->
    <meta name="darkreader-lock" />

    <!-- disabling referrer can fix some provider problems -->
    <!-- <meta name="referrer" content="no-referrer" /> -->
    <meta name="referrer" content="always" />

    <title>
      TopWaatch | Watch movies and shows with bookmarks, progress, and history
      that follow you
    </title>

    {{#if opensearchEnabled }}
    <!-- OpenSearch -->
    <link
      rel="search"
      type="application/opensearchdescription+xml"
      title="TopWaatch"
      href="/opensearch.xml"
    />

    <!-- Google Sitelinks / entity  alternateName helps associate old brand searches -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebSite",
        "name": "TopWaatch",
        "alternateName": ["P-Stream", "PStream", "pstream", "pstream.net", "Z-Stream", "ZStream", "zstream"],
        "url": "{{ routeDomain }}",
        "sameAs": [
          "https://topwaatch.mov",
          "https://pstream.net",
          "https://pstream.mov",
          "https://zstream.mov"
        ],
        "potentialAction": {
          "@type": "SearchAction",
          "target": {
            "@type": "EntryPoint",
            "urlTemplate": "{{ routeDomain }}/browse/?q={search_term_string}"
          },
          "query-input": "required name=search_term_string"
        }
      }
    </script>
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "TopWaatch",
        "alternateName": ["P-Stream", "PStream", "pstream", "Z-Stream", "ZStream", "zstream"],
        "url": "{{ routeDomain }}",
        "sameAs": [
          "https://topwaatch.mov",
          "https://pstream.net",
          "https://pstream.mov",
          "https://zstream.mov"
        ]
      }
    </script>
    {{/if}}
  </head>

  <body>
    <noscript>
      <h1>TopWaatch</h1>
      <p>
        TopWaatch is the continuation of P-Stream  rebuilt to deliver a true
        unified experience across web, mobile, and desktop. Your bookmarks,
        watch history, and progress follow you on every screen, so you can pick
        up exactly where you left off.
      </p>
      <p>
        If you were looking for P-Stream, pstream, or pstream.net  you are in
        the right place. TopWaatch is the next chapter. Enable JavaScript to
        load the site.
      </p>
    </noscript>
    <div id="root"></div>
    <script type="module" src="/src/index.tsx"></script>
  </body>
</html>
