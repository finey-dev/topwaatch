[package]
name = "topwaatch-desktop"
version = "0.1.3"
description = "TopWaatch desktop app"
authors = ["TopWaatch"]
edition = "2021"

[lib]
name = "topwaatch_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
log = "0.4"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
strip = true
