name: Desktop Release

on:
  push:
    tags:
      - "desktop-v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.1.0). Tag will be desktop-v{version}."
        required: true
        default: "0.1.2"

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Resolve release version
        id: version
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/desktop-v* ]]; then
            VERSION="${GITHUB_REF_NAME#desktop-v}"
          else
            VERSION="${{ github.event.inputs.version }}"
          fi
          if [[ -z "$VERSION" ]]; then
            echo "Version is required" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=desktop-v$VERSION" >> "$GITHUB_OUTPUT"

  build:
    needs: prepare
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            os: ubuntu-22.04
            rust_target: x86_64-unknown-linux-gnu
          - platform: linux-aarch64
            os: ubuntu-22.04-arm
            rust_target: aarch64-unknown-linux-gnu
          - platform: windows-x86_64
            os: windows-latest
            rust_target: x86_64-pc-windows-msvc

    runs-on: ${{ matrix.os }}
    env:
      # Vite inlines VITE_* at build time (beforeBuildCommand).
      # All values: Settings → Secrets and variables → Actions → Secrets
      VITE_NORMAL_ROUTER: ${{ secrets.VITE_NORMAL_ROUTER }}
      VITE_DESKTOP_APP: ${{ secrets.VITE_DESKTOP_APP }}
      VITE_OPENSEARCH_ENABLED: ${{ secrets.VITE_OPENSEARCH_ENABLED }}
      VITE_ALLOW_FEBBOX_KEY: ${{ secrets.VITE_ALLOW_FEBBOX_KEY }}
      VITE_USE_TRAKT: ${{ secrets.VITE_USE_TRAKT }}
      VITE_DESKTOP_RELEASES_REPO: ${{ secrets.VITE_DESKTOP_RELEASES_REPO }}
      VITE_DESKTOP_RELEASE_TAG_PREFIX: ${{ secrets.VITE_DESKTOP_RELEASE_TAG_PREFIX }}
      VITE_APP_DOMAIN: ${{ secrets.VITE_APP_DOMAIN }}
      VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
      VITE_CORS_PROXY_URL: ${{ secrets.VITE_CORS_PROXY_URL }}
      VITE_M3U8_PROXY_URL: ${{ secrets.VITE_M3U8_PROXY_URL }}
      VITE_FEBBOX_CLIENT_ID: ${{ secrets.VITE_FEBBOX_CLIENT_ID }}
      VITE_FEBBOX_REDIRECT_URI: ${{ secrets.VITE_FEBBOX_REDIRECT_URI }}
      VITE_TRAKT_CLIENT_ID: ${{ secrets.VITE_TRAKT_CLIENT_ID }}
      VITE_TRAKT_REDIRECT_URI: ${{ secrets.VITE_TRAKT_REDIRECT_URI }}
      VITE_TMDB_READ_API_KEY: ${{ secrets.VITE_TMDB_READ_API_KEY }}
      VITE_TRAKT_CLIENT_SECRET: ${{ secrets.VITE_TRAKT_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify desktop build env
        shell: bash
        run: |
          missing=()
          required=(
            VITE_NORMAL_ROUTER
            VITE_DESKTOP_APP
            VITE_OPENSEARCH_ENABLED
            VITE_ALLOW_FEBBOX_KEY
            VITE_USE_TRAKT
            VITE_DESKTOP_RELEASES_REPO
            VITE_DESKTOP_RELEASE_TAG_PREFIX
            VITE_APP_DOMAIN
            VITE_BACKEND_URL
            VITE_CORS_PROXY_URL
            VITE_M3U8_PROXY_URL
            VITE_FEBBOX_CLIENT_ID
            VITE_FEBBOX_REDIRECT_URI
            VITE_TRAKT_CLIENT_ID
            VITE_TRAKT_REDIRECT_URI
            VITE_TMDB_READ_API_KEY
            VITE_TRAKT_CLIENT_SECRET
          )
          for key in "${required[@]}"; do
            if [[ -z "${!key:-}" ]]; then
              missing+=("$key")
            fi
          done
          if ((${#missing[@]} > 0)); then
            echo "Missing GitHub Actions configuration for desktop build:" >&2
            printf '  - %s\n' "${missing[@]}" >&2
            echo "Add missing keys under Settings → Secrets and variables → Actions → Secrets" >&2
            exit 1
          fi

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install Linux dependencies
        if: startsWith(matrix.platform, 'linux-')
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Install workspace dependencies
        run: bun install --frozen-lockfile

      - name: Sync desktop version
        shell: bash
        run: |
          VERSION='${{ needs.prepare.outputs.version }}'
          node - <<'NODE'
          const fs = require('node:fs');
          const version = process.env.VERSION;
          const tauriConfPath = 'apps/desktop/src-tauri/tauri.conf.json';
          const pkgPath = 'apps/desktop/package.json';
          const tauriConf = JSON.parse(fs.readFileSync(tauriConfPath, 'utf8'));
          tauriConf.version = version;
          fs.writeFileSync(tauriConfPath, JSON.stringify(tauriConf, null, 2) + '\n');
          const pkg = JSON.parse(fs.readFileSync(pkgPath, 'utf8'));
          pkg.version = version;
          fs.writeFileSync(pkgPath, JSON.stringify(pkg, null, 2) + '\n');
          NODE
        env:
          VERSION: ${{ needs.prepare.outputs.version }}

      - name: Generate desktop icons
        working-directory: apps/desktop
        run: bun run icons

      - name: Verify Rust crate compiles
        working-directory: apps/desktop/src-tauri
        run: cargo check --target ${{ matrix.rust_target }}

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_NORMAL_ROUTER: ${{ secrets.VITE_NORMAL_ROUTER }}
          VITE_DESKTOP_APP: ${{ secrets.VITE_DESKTOP_APP }}
          VITE_OPENSEARCH_ENABLED: ${{ secrets.VITE_OPENSEARCH_ENABLED }}
          VITE_ALLOW_FEBBOX_KEY: ${{ secrets.VITE_ALLOW_FEBBOX_KEY }}
          VITE_USE_TRAKT: ${{ secrets.VITE_USE_TRAKT }}
          VITE_DESKTOP_RELEASES_REPO: ${{ secrets.VITE_DESKTOP_RELEASES_REPO }}
          VITE_DESKTOP_RELEASE_TAG_PREFIX: ${{ secrets.VITE_DESKTOP_RELEASE_TAG_PREFIX }}
          VITE_APP_DOMAIN: ${{ secrets.VITE_APP_DOMAIN }}
          VITE_BACKEND_URL: ${{ secrets.VITE_BACKEND_URL }}
          VITE_CORS_PROXY_URL: ${{ secrets.VITE_CORS_PROXY_URL }}
          VITE_M3U8_PROXY_URL: ${{ secrets.VITE_M3U8_PROXY_URL }}
          VITE_FEBBOX_CLIENT_ID: ${{ secrets.VITE_FEBBOX_CLIENT_ID }}
          VITE_FEBBOX_REDIRECT_URI: ${{ secrets.VITE_FEBBOX_REDIRECT_URI }}
          VITE_TRAKT_CLIENT_ID: ${{ secrets.VITE_TRAKT_CLIENT_ID }}
          VITE_TRAKT_REDIRECT_URI: ${{ secrets.VITE_TRAKT_REDIRECT_URI }}
          VITE_TMDB_READ_API_KEY: ${{ secrets.VITE_TMDB_READ_API_KEY }}
          VITE_TRAKT_CLIENT_SECRET: ${{ secrets.VITE_TRAKT_CLIENT_SECRET }}
        with:
          projectPath: apps/desktop
          tauriScript: bun run tauri
          tagName: ${{ needs.prepare.outputs.tag }}
          releaseName: TopWaatch Desktop v${{ needs.prepare.outputs.version }}
          releaseBody: |
            Desktop builds for Linux and Windows.

            Downloads are also surfaced automatically on the TopWaatch download page.
          releaseDraft: true
          prerelease: false
          args: --target ${{ matrix.rust_target }}

  publish-manifest:
    needs: [prepare, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Download release assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          mkdir -p release-assets
          gh release download "${{ needs.prepare.outputs.tag }}" \
            --dir release-assets \
            --pattern '*' \
            --clobber

      - name: Generate desktop manifests
        run: |
          node scripts/desktop/generate-release-manifest.mjs \
            --version "${{ needs.prepare.outputs.version }}" \
            --tag "${{ needs.prepare.outputs.tag }}" \
            --repo "${{ secrets.VITE_DESKTOP_RELEASES_REPO }}" \
            --assets-dir release-assets \
            --out-dir apps/desktop/releases

      - name: Upload manifest assets to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.prepare.outputs.tag }}" \
            apps/desktop/releases/desktop-manifest.json \
            apps/desktop/releases/latest.json \
            --clobber

      - name: Commit manifest to default branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/desktop/releases/desktop-manifest.json apps/desktop/releases/latest.json
          if git diff --cached --quiet; then
            echo "No manifest changes to commit."
            exit 0
          fi
          git commit -m "chore(desktop): update release manifests for ${{ needs.prepare.outputs.tag }}"
          git push

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.prepare.outputs.tag }}" --draft=false
